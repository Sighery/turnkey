syntax = "proto3";

option go_package = "github.com/Sighery/turnkey/daemons/protogen/btdaemons";

package btdaemons;

// Daemon service
service Daemon {
	rpc IsReady(IsReadyRequest) returns (IsReadyResponse) {}
	rpc ConnectBle(ConnectBleRequest) returns (ConnectBleResponse) {}
}

message IsReadyRequest {}

message IsReadyResponse {
	bool status = 1;
}

message ConnectBleRequest {
	string addr = 1;
}

message ConnectBleResponse {
	string connectionId = 1;
}
